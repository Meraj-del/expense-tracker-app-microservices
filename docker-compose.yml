services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend-network

  mysql:
    image: mysql:8.3
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka-kraft
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-kraft:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend-network

  auth-service:
    build: ./auth-jar
    image: authservice
    container_name: auth-service
    ports:
      - "9898:9898"
    environment:
      MYSQL_HOST: mysql-container
      MYSQL_PORT: 3306
      AUTH_DB_NAME: authservice
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_HOST: kafka-kraft
      KAFKA_PORT: 9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - backend-network

  user-service:
    build: ./user-jar
    image: userservice
    container_name: user-service
    ports:
      - "9810:9810"
    environment:
      MYSQL_HOST: mysql-container
      MYSQL_PORT: 3306
      USER_DB_NAME: userservice
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_HOST: kafka-kraft
      KAFKA_PORT: 9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - backend-network

  expense-service:
    build: ./expense-jar
    image: expenseservice
    container_name: expense-service
    ports:
      - "9820:9820"
    environment:
      MYSQL_HOST: mysql-container
      MYSQL_PORT: 3306
      EXPENSE_DB_NAME: expenseservice
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_HOST: kafka-kraft
      KAFKA_PORT: 9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - backend-network

  ds-service:
    build: ./jar
    image: ds-service
    container_name: ds-service
    ports:
      - "8000:8000"
    environment:
      KAFKA_HOST: kafka-kraft
      KAFKA_PORT: 9092
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
    depends_on:
      - kafka
      - mysql
      - expense-service
      - user-service
    networks:
      - backend-network

volumes:
  mysql_data:
  kafka_data:

networks:
  backend-network:
    driver: bridge